apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: RiskDB
    uid: riskdb
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: bi_reader            # compte en lecture seule
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $BI_READER_PASSWORD
