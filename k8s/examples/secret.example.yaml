# EXEMPLE : copier en k8s/01-secret.yaml (ignoré par git) et remplacer les valeurs.
# Plus sûr : kubectl create secret generic risk-api-secrets -n risk --from-env-file=.env.k8s
# host.docker.internal = ta machine Windows : l'API dans Kubernetes réutilise les bases du docker compose.
apiVersion: v1
kind: Secret
metadata:
  name: risk-api-secrets
  namespace: risk
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg2://risk:ChangeMePg2026@host.docker.internal:5432/riskdb
  MONGO_URL: mongodb://risk:ChangeMeMongo2026@host.docker.internal:27017/?authSource=admin
  MONGO_DB: riskdb
  API_KEY: remplace-moi
