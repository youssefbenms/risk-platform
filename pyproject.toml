[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.coverage.run]
source = ["src"]
omit = ["src/collect/*"]
